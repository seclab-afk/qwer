    - mv libjbig/*.a ../lib/
    - mv libjbig/*.h ../include/
    - cd ..
    - cmake . -DCMAKE_INSTALL_PREFIX="$(pwd)" -DBUILD_SHARED_LIBS=off -Dtiff-tools=OFF -Dtiff-tests=OFF -Dtiff-contrib=OFF -Dtiff-docs=OFF
    - make -j$(nproc) tiff tiffxx
    - make install
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base}/include {harness_path} -o {output} -Wl,--whole-archive {lib_base}/lib/libtiffxx.a {lib_base}/lib/libtiff.a -Wl,--no-whole-archive {lib_base}/lib/libz.a {lib_base}/lib/libjpeg.a {lib_base}/lib/libjbig.a {lib_base}/lib/libjbig85.a -Wl,-Bstatic -llzma -Wl,-Bdynamic
