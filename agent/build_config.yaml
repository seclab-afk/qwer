    CXXFLAGS: -fsanitize=address,fuzzer-no-link -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer
    LDFLAGS: -fsanitize=address,fuzzer-no-link -O0 -g -fno-omit-frame-pointer
    SRC: ./libxml2_fuzz
    OUT: ./libxml2_fuzz
    LIBFUZZER_LINK: -fsanitize=fuzzer
  build_library:
    - ./autogen.sh --enable-static --disable-shared --with-zlib --with-lzma --without-debug --without-http --without-python
