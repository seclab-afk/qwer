# ------------------------------------------------------------------------------------------------
# libpng
libpng_api:
  repo_url: https://github.com/pnggroup/libpng.git
  branch: 83b23a888b4395c3ae0af3f6d484fce3e4a81155
  build_dir: ./libpng_api
  lib_dir: libpng_api/.libs/libpng16.so
  dependencies:
    - build-essential
    - autoconf
    - automake
    - libtool
  env:
    CC: clang
    CXX: clang++
    CFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./libpng_api
  build_library:
    - git clone https://github.com/madler/zlib.git
    - cd zlib
    - ./configure
    - make -j$(nproc)
    - cd ..
    - cat scripts/pnglibconf.dfa | sed -e 's/option STDIO/option STDIO disabled/' -e 's/option WARNING /option WARNING disabled/' > scripts/pnglibconf.dfa.temp
    - mv scripts/pnglibconf.dfa.temp scripts/pnglibconf.dfa
    - autoreconf -f -i
    - ./configure
    - make -j$(nproc) clean
    - make -j$(nproc) libpng16.la
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base} {harness_path} -o {output} {lib_base}/.libs/libpng16.so -Wl,-rpath={lib_base}/.libs {lib_base}/zlib/libz.a

libpng_fuzz:
  repo_url: https://github.com/pnggroup/libpng.git
  branch: 83b23a888b4395c3ae0af3f6d484fce3e4a81155
  build_dir: ./libpng_fuzz
  lib_dir: libpng_fuzz/.libs/libpng16.a
  dependencies:
    - zlib1g-dev
    - build-essential
    - autoconf
    - automake
    - libtool
  env:
    CC: afl-clang-lto
    CXX: afl-clang-lto++
    CFLAGS: -fsanitize=address,fuzzer-no-link -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address,fuzzer-no-link -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address,fuzzer-no-link -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./libpng_fuzz
    OUT: ./libpng_fuzz
  build_library:
    - git clone https://github.com/madler/zlib.git
    - cd zlib
    - ./configure
    - make -j$(nproc)
    - cd ..
    - cat scripts/pnglibconf.dfa | sed -e 's/option STDIO/option STDIO disabled/' -e 's/option WARNING /option WARNING disabled/' > scripts/pnglibconf.dfa.temp
    - mv scripts/pnglibconf.dfa.temp scripts/pnglibconf.dfa
    - autoreconf -f -i
    - ./configure
    - make -j$(nproc) clean
    - make -j$(nproc) libpng16.la
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base} {harness_path} -o {output} {lib_base}/.libs/libpng16.a {lib_base}/zlib/libz.a

libpng_cov:
  repo_url: https://github.com/pnggroup/libpng.git
  branch: 83b23a888b4395c3ae0af3f6d484fce3e4a81155
  build_dir: ./libpng_cov
  lib_dir: libpng_cov/.libs/libpng16.a
  dependencies:
    - zlib1g-dev
    - build-essential
    - autoconf
    - automake
    - libtool
  env:
    CC: clang
    CXX: clang++
    CFLAGS: -fprofile-instr-generate -fcoverage-mapping -g -O2
    CXXFLAGS: -fprofile-instr-generate -fcoverage-mapping -D_GLIBCXX_DEBUG -g -O2
    LDFLAGS: -fprofile-instr-generate -fcoverage-mapping -g -O2
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./libpng_cov
    OUT: ./libpng_cov
  build_library:
    - git clone https://github.com/madler/zlib.git
    - cd zlib
    - ./configure
    - make -j$(nproc)
    - cd ..
    - cat scripts/pnglibconf.dfa | sed -e 's/option STDIO/option STDIO disabled/' -e 's/option WARNING /option WARNING disabled/' > scripts/pnglibconf.dfa.temp
    - mv scripts/pnglibconf.dfa.temp scripts/pnglibconf.dfa
    - autoreconf -f -i
    - ./configure
    - make -j$(nproc) clean
    - make -j$(nproc) libpng16.la
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base} {harness_path} -o {output} -Wl,--whole-archive {lib_base}/.libs/libpng16.a -Wl,--no-whole-archive {lib_base}/zlib/libz.a
# ------------------------------------------------------------------------------------------------
# libxml2
libxml2_api:
  repo_url: https://gitlab.gnome.org/GNOME/libxml2.git
  branch: 22f9d730898d2dfcc03a484e65e1f8fc3675225f
  build_dir: ./libxml2_api
  lib_dir: libxml2_api/.libs/libxml2.so
  dependencies:
    - autoconf
    - automake
    - libtool
    - pkg-config
    - docbook-xsl
    - zlib1g-dev
    - liblzma-dev
  include_dir:
    - "{lib_base}/include"
  env:
    CC: clang
    CXX: clang++
    CFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./libxml2_api
    OUT: ./libxml2_api
  build_library:
    - ./autogen.sh --disable-static --enable-shared --with-zlib --with-lzma --without-debug --without-http --without-python --with-docs
    - sed -i 's/DOXYGEN) -q/DOXYGEN)/g' doc/Makefile
    - make -j$(nproc) clean
    - make -j$(nproc) libxml2.la
    - make -j$(nproc) -C doc
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base} -I{lib_base}/include {harness_path} -o {output} {lib_base}/.libs/libxml2.so -Wl,-rpath={lib_base}/.libs -lz -llzma

libxml2_fuzz:
  repo_url: https://gitlab.gnome.org/GNOME/libxml2.git
  branch: 22f9d730898d2dfcc03a484e65e1f8fc3675225f
