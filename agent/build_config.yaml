    build_library:
        - git clone --depth=1 https://github.com/abseil/abseil-cpp
        - cd abseil-cpp
        - mkdir -p build
        - cd build
        - cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..
        - make -j$(nproc)
        - make install
        - ldconfig
        - cd ../..
        - rm -rf abseil-cpp
        - make -j$(nproc) obj/so/libre2.so
        - make common-install
    build_harness:
        - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++17 -I{lib_base} {harness_path} -o {output} {lib_base}/obj/so/libre2.so -Wl,-rpath={lib_base}/obj/so $(pkg-config re2 --libs | sed -e 's/-lre2//')
