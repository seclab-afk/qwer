# ------------------------------------------------------------------------------------------------
# assimp
assimp_api:
  repo_url: https://github.com/assimp/assimp.git
  branch: v5.3.1
  build_dir: ./assimp_api
  lib_dir: assimp_api/bin/libassimp.so
  include_dir:
    - "{lib_base}/include/"
    - "{lib_base}/code/"
    - "{lib_base}/contrib/"
  dependencies:
    - cmake
    - ninja-build
  env:
    CC: clang
    CXX: clang++
    # CFLAGS: -O0 -g -fno-omit-frame-pointer -fvisibility=hidden -ffunction-sections -fdata-sections
    # CXXFLAGS: -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fvisibility=hidden -fvisibility-inlines-hidden -ffunction-sections -fdata-sections
    # LDFLAGS: -O0 -g -fno-omit-frame-pointer -Wl,--gc-sections -Wl,--exclude-libs,ALL
    CFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./assimp_api
    OUT: ./assimp_api
  build_library:
    - cmake CMakeLists.txt -G "Ninja" -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIB=ON -DASSIMP_BUILD_ZLIB=ON -DASSIMP_BUILD_TESTS=OFF -DASSIMP_BUILD_ASSIMP_TOOLS=OFF -DASSIMP_BUILD_SAMPLES=OFF -DASSIMP_BUILD_DOCS=ON
    - cmake --build . --target assimp
    - cmake --build . --target docs
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base}/include {harness_path} -o {output} {lib_base}/bin/libassimp.so -Wl,-rpath={lib_base}/bin {lib_base}/contrib/zlib/libzlibstatic.a

assimp_fuzz:
  repo_url: https://github.com/assimp/assimp.git
  branch: v5.3.1
  build_dir: ./assimp_fuzz
  lib_dir: assimp_fuzz/lib/libassimp.a
  dependencies:
    - cmake
    - ninja-build
  env:
    CC: afl-clang-lto
    CXX: afl-clang-lto++
    CFLAGS: -fsanitize=address,fuzzer-no-link -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address,fuzzer-no-link -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address,fuzzer-no-link -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./assimp_fuzz
    OUT: ./assimp_fuzz
  build_library:
    - cmake CMakeLists.txt -G "Ninja" -DBUILD_SHARED_LIBS=OFF -DASSIMP_BUILD_ZLIB=ON -DASSIMP_BUILD_TESTS=OFF -DASSIMP_BUILD_ASSIMP_TOOLS=OFF -DASSIMP_BUILD_SAMPLES=OFF
    - cmake --build . --target assimp
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base}/include {harness_path} -o {output} {lib_base}/lib/libassimp.a {lib_base}/contrib/zlib/libzlibstatic.a

assimp_cov:
  repo_url: https://github.com/assimp/assimp.git
  branch: v5.3.1
  build_dir: ./assimp_cov
  lib_dir: assimp_cov/lib/libassimp.a
  dependencies:
