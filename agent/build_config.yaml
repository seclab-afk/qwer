# ------------------------------------------------------------------------------------------------
# libtiff
libtiff_api:
  repo_url: https://gitlab.com/libtiff/libtiff.git
  branch: b937f8d1142789c24094f7d4f1db70a9625b62a1
  build_dir: ./libtiff_api
  lib_dir: libtiff_api/lib/libtiff.so
  include_dir:
    - "{lib_base}/include"
  dependencies:
    - make
    - autoconf
    - automake
    - libtool
    - cmake
    - nasm
    - liblzma-dev
  env:
    CC: clang
    CXX: clang++
    CFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    CXXFLAGS: -fsanitize=address -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
    LDFLAGS: -fsanitize=address -O0 -g -fno-omit-frame-pointer -fPIC
    LIBFUZZER_LINK: -fsanitize=fuzzer
    SRC: ./libtiff_api
    OUT: ./libtiff_api
  build_library:
    - git clone https://github.com/madler/zlib.git
    - git clone https://github.com/libjpeg-turbo/libjpeg-turbo
    - git clone https://www.cl.cam.ac.uk/~mgk25/git/jbigkit
    - cd zlib
    - ./configure --prefix="../"
    - make -j$(nproc) libz.a
    - make install
    - cd ..
    - cd libjpeg-turbo
    - cmake . -DCMAKE_INSTALL_PREFIX="../" -DENABLE_STATIC=1 -DENABLE_SHARED=0
    - make -j$(nproc) jpeg-static
    - make install
    - cd ..
    - cd jbigkit
    - CFLAGS="-O2 -g" LDFLAGS="" make lib
    - mkdir -p ../include
    - mv libjbig/*.a ../lib/
    - mv libjbig/*.h ../include/
    - cd ..
    - cmake . -DCMAKE_INSTALL_PREFIX="$(pwd)" -DBUILD_SHARED_LIBS=on -Dtiff-tools=OFF -Dtiff-tests=OFF -Dtiff-contrib=OFF
    - make -j$(nproc) tiff tiffxx doc-html
    - make install
  build_harness:
    - $CXX $CXXFLAGS $LIBFUZZER_LINK -std=c++11 -I{lib_base}/include {harness_path} -o {output} {lib_base}/lib/libtiffxx.so {lib_base}/lib/libtiff.so -Wl,-rpath={lib_base}/lib {lib_base}/lib/libz.a {lib_base}/lib/libjpeg.a {lib_base}/lib/libjbig.a {lib_base}/lib/libjbig85.a -Wl,-Bstatic -llzma -Wl,-Bdynamic

