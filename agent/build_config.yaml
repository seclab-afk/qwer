    branch: 972a15cedd008d846f1a39b2e88ce48d7f166cbd
    build_dir: ./re2_api
    lib_dir: re2_api/obj/so/libre2.so
    dependencies:
      - cmake 
      - make 
      - pkg-config
    env:
        CC: clang
        CXX: clang++
        LD: clang++
        CFLAGS: -fsanitize=address -DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION -DNDEBUG -O0 -g -fno-omit-frame-pointer -fPIC
        CXXFLAGS: -fsanitize=address -DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION -DNDEBUG -D_GLIBCXX_DEBUG -O0 -g -fno-omit-frame-pointer -fPIC
